<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Auth Test</title>
<style>body{background:#111;color:#0f0;font:13px/1.6 monospace;padding:16px}h2{color:#0ff}.ok{color:#0f0}.fail{color:#f44}.warn{color:#ff0}button{background:#0ff;color:#000;border:none;padding:8px 16px;border-radius:4px;margin:8px 4px;font:14px monospace;cursor:pointer}</style>
</head><body>
<h2>Auth Test v14</h2>
<div id="log"></div>
<button onclick="doOAuth()">Do OAuth Redirect</button>
<button onclick="location.reload()">Reload</button>
<script>
var L=document.getElementById("log");
function log(m,c){var d=document.createElement("div");d.className=c||"";d.textContent=m;L.appendChild(d);console.log(m)}
var APP_ID="cli_a968a864a0f89bdd",REDIR="https://tiktok-shop-awards.github.io/tiktok-awards/auth-test.html",AIPA="https://da1e5fb0.aipa.bytedance.net/api/auth/login";
(async function(){
log("UA: "+navigator.userAgent.substring(0,120));
log("isFeishu: "+/Lark|Feishu/i.test(navigator.userAgent));
var p=new URLSearchParams(location.search),code=p.get("code");
if(code){log("Got code from URL!","ok");history.replaceState({},"",location.pathname);
try{var r=await fetch(AIPA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code}),signal:AbortSignal.timeout(8000)});
log("HTTP "+r.status);var d=await r.json();log("AIPA: "+JSON.stringify(d),d.success?"ok":"fail");
if(d.success&&d.data){log("user_id: "+d.data.user_id,"ok");log("username: "+d.data.username,"ok");
sessionStorage.setItem("feishu_user",JSON.stringify({userId:d.data.user_id,username:d.data.username||""}));
log("Saved! Go to main site now.","ok")}}catch(e){log("AIPA err: "+e.message,"fail")}return}
log("No code. Try SDK...");
try{await new Promise((a,b)=>{var s=document.createElement("script");s.src="https://lf-scm-cn.feishucdn.com/lark/op/h5-js-sdk-1.5.44.js";s.onload=a;s.onerror=b;document.head.appendChild(s)});log("SDK loaded","ok")}catch(e){log("SDK load fail","fail")}
log("h5sdk:"+!!window.h5sdk+" tt:"+!!window.tt);
if(window.h5sdk&&window.h5sdk.ready)await new Promise(r=>window.h5sdk.ready(()=>r()));
if(window.tt){log("Try requestAuthCode...");
var c=await new Promise(r=>{window.tt.requestAuthCode({appId:APP_ID,success:res=>{log("rAC OK: "+res.code,"ok");r(res.code)},fail:e=>{log("rAC fail: "+JSON.stringify(e),"fail");r(null)}})});
if(c){try{var r=await fetch(AIPA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:c}),signal:AbortSignal.timeout(8000)});var d=await r.json();log("AIPA: "+JSON.stringify(d),d.success?"ok":"fail");
if(d.success&&d.data){log("user_id: "+d.data.user_id,"ok");log("username: "+d.data.username,"ok")}}catch(e){log("err: "+e.message,"fail")}}
else{log("SDK auth failed. Need OAuth redirect.","fail")}}
else{log("No tt obj","fail")}
})();
function doOAuth(){var u="https://open.feishu.cn/open-apis/authen/v1/authorize?app_id="+APP_ID+"&redirect_uri="+encodeURIComponent(REDIR)+"&response_type=code&state=auth";location.href=u}
</script></body></html>
