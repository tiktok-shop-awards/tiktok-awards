<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Feishu Native Share Test</title>
  <script src="https://lf-scm-cn.feishucdn.com/lark/op/h5-js-sdk-1.5.48.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050609;
      color: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 10%, rgba(37, 244, 238, .12), transparent 28%),
        radial-gradient(circle at 90% 88%, rgba(255, 47, 87, .1), transparent 30%),
        #050609;
    }

    .test-card {
      width: min(520px, 100%);
      padding: 30px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 24px;
      background: rgba(15,18,24,.94);
      box-shadow: 0 30px 90px rgba(0,0,0,.46);
    }

    .eyebrow {
      color: #55eee7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0 10px;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.04;
      letter-spacing: -1px;
    }

    .intro {
      margin: 0;
      color: rgba(255,255,255,.6);
      font-size: 14px;
      line-height: 1.65;
    }

    .privacy {
      display: grid;
      gap: 9px;
      margin: 24px 0;
      padding: 16px;
      border-left: 3px solid #55eee7;
      background: rgba(85,238,231,.055);
    }

    .privacy span {
      color: rgba(255,255,255,.72);
      font-size: 12px;
      line-height: 1.45;
    }

    .privacy span::before {
      content: "✓";
      margin-right: 8px;
      color: #55eee7;
      font-weight: 900;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      color: #061112;
      background: #55eee7;
    }

    .primary:hover { background: #77fff7; }
    .primary:disabled { opacity: .56; cursor: wait; }

    .confirm {
      display: none;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(255,196,88,.2);
      border-radius: 14px;
      background: rgba(255,196,88,.06);
    }

    .confirm.visible { display: grid; }

    .confirm p {
      margin: 0;
      color: rgba(255,255,255,.75);
      font-size: 12px;
      line-height: 1.55;
    }

    .confirm-buttons {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 8px;
    }

    .secondary {
      color: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
    }

    .status {
      min-height: 20px;
      margin: 16px 0 0;
      color: rgba(255,255,255,.46);
      font-size: 12px;
      line-height: 1.5;
    }

    .status.success { color: #64e69a; }
    .status.error { color: #ff8799; }

    .footnote {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.34);
      font-size: 10px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="test-card">
    <div class="eyebrow">RECOGNITION HUB · SAFE TEST</div>
    <h1>飞书原生分享测试</h1>
    <p class="intro">用于验证网页应用能否唤起飞书原生会话选择器。请仅选择自己或专用测试会话。</p>

    <div class="privacy">
      <span>不读取真实奖项或员工数据</span>
      <span>不读取联系人或群聊列表</span>
      <span>不会在选择会话前发送消息</span>
      <span>每次只能选择一个内部会话</span>
    </div>

    <div class="actions">
      <button id="start-button" class="primary" type="button">开始安全测试</button>
      <div id="confirm-panel" class="confirm">
        <p>下一步会打开飞书原生选择器。测试卡会在你选择并确认后真实发送，请只选择自己或测试会话。</p>
        <div class="confirm-buttons">
          <button id="cancel-button" class="secondary" type="button">取消</button>
          <button id="share-button" class="primary" type="button">打开飞书选择器</button>
        </div>
      </div>
    </div>

    <p id="status" class="status" role="status" aria-live="polite">请在飞书客户端内打开此页面。</p>
    <p class="footnote">测试卡只包含固定测试文字和本页链接，不包含 Recognition Hub 业务数据。</p>
  </main>

  <script>
    const APP_ID = 'cli_a968a864a0f89bdd';
    const CONFIG_ENDPOINT = 'https://da1e5fb0.aipa.bytedance.net/api/jssdk_config';
    const startButton = document.getElementById('start-button');
    const confirmPanel = document.getElementById('confirm-panel');
    const cancelButton = document.getElementById('cancel-button');
    const shareButton = document.getElementById('share-button');
    const status = document.getElementById('status');
    let configPromise = null;

    function setStatus(message, type = '') {
      status.textContent = message;
      status.className = `status ${type}`.trim();
    }

    function configureJssdk() {
      if (configPromise) return configPromise;
      configPromise = fetch(`${CONFIG_ENDPOINT}?url=${encodeURIComponent(location.href.split('#')[0])}`)
        .then(response => {
          if (!response.ok) throw new Error(`Config HTTP ${response.status}`);
          return response.json();
        })
        .then(response => {
          const config = response?.data?.data || response?.data || response?.result || response;
          if (!config?.signature) throw new Error('Missing JSSDK signature');
          return new Promise((resolve, reject) => {
            window.h5sdk.config({
              appId: config.appId || config.app_id || APP_ID,
              timestamp: config.timestamp,
              nonceStr: config.nonceStr || config.noncestr || config.nonce_str,
              signature: config.signature,
              jsApiList: ['biz.chat.sendMessageCard'],
              onSuccess: resolve,
              onFail: reject
            });
          });
        })
        .catch(error => {
          configPromise = null;
          throw error;
        });
      return configPromise;
    }

    function buildTestCard() {
      return {
        msg_type: 'interactive',
        update_multi: false,
        card: {
          config: { wide_screen_mode: true },
          header: {
            template: 'turquoise',
            title: { tag: 'plain_text', content: 'Recognition native share test' }
          },
          elements: [
            {
              tag: 'div',
              text: {
                tag: 'lark_md',
                content: '**测试成功**\n这是一张不包含真实奖项或员工信息的测试卡片。'
              }
            },
            {
              tag: 'note',
              elements: [
                { tag: 'plain_text', content: 'Global E-commerce Recognition Hub · Safe test' }
              ]
            }
          ]
        }
      };
    }

    async function openNativeShare() {
      shareButton.disabled = true;
      shareButton.textContent = '正在打开…';
      setStatus('正在连接飞书原生能力…');
      try {
        if (!window.h5sdk) throw new Error('请在飞书客户端中打开此页面');
        await configureJssdk();
        if (!window.tt || typeof window.tt.sendMessageCard !== 'function') {
          throw new Error('当前飞书客户端不支持原生卡片分享');
        }
        await new Promise((resolve, reject) => {
          window.tt.sendMessageCard({
            shouldChooseChat: true,
            chooseChatParams: {
              allowCreateGroup: false,
              multiSelect: false,
              externalChat: false,
              confirmTitle: '发送测试卡片'
            },
            cardContent: buildTestCard(),
            withAdditionalMessage: false,
            success: resolve,
            fail: reject
          });
        });
        confirmPanel.classList.remove('visible');
        startButton.hidden = false;
        setStatus('测试卡片已发送。', 'success');
      } catch (error) {
        const errorCode = Number(error?.errCode ?? error?.errno);
        if (errorCode === -6) {
          setStatus('已取消，没有发送消息。');
        } else {
          setStatus(`无法调用飞书原生分享：${error?.errMsg || error?.message || '未知错误'}`, 'error');
        }
      } finally {
        shareButton.disabled = false;
        shareButton.textContent = '打开飞书选择器';
      }
    }

    startButton.addEventListener('click', () => {
      startButton.hidden = true;
      confirmPanel.classList.add('visible');
      setStatus('请确认只选择自己或测试会话。');
    });

    cancelButton.addEventListener('click', () => {
      confirmPanel.classList.remove('visible');
      startButton.hidden = false;
      setStatus('测试尚未开始。');
    });

    shareButton.addEventListener('click', openNativeShare);
  </script>
</body>
</html>
